<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dori Studio 2.0</title><style>
:root{color-scheme:dark;--bg:#15131c;--panel:#211e2b;--ink:#f4efff;--muted:#b4a9c5;--line:#393245;--accent:#c5a8ff}body.light{color-scheme:light;--bg:#f7f4fa;--panel:#fff;--ink:#292039;--muted:#71657f;--line:#e4dbea;--accent:#7143b4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}aside{position:fixed;width:235px;height:100vh;background:var(--panel);padding:26px 18px;border-right:1px solid var(--line)}h1,h2,h3,p{margin:0 0 12px}small,.muted{color:var(--muted)}.brand{font-size:25px;font-weight:800;letter-spacing:-1px;color:var(--accent)}nav{display:grid;gap:7px;margin:35px 0}button,input,textarea,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}button{cursor:pointer}button:hover,button.active{border-color:var(--accent);color:var(--accent)}nav button{text-align:left;border-color:transparent}main{margin-left:235px;padding:35px;max-width:1500px}.hero{background:linear-gradient(120deg,#4b326b,#252035);color:#fff;padding:32px;border-radius:22px;margin-bottom:24px}.hero h1{font-size:clamp(28px,5vw,52px);letter-spacing:-2px}.primary{background:#b99af5;color:#211332;font-weight:700;border:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,245px),1fr));gap:15px;margin:16px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:19px;overflow-wrap:anywhere}.metric{font-size:30px;font-weight:750;color:var(--accent)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.tag{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:4px 9px;color:var(--accent);font-size:12px;margin-bottom:10px}progress{width:100%;accent-color:var(--accent)}dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:20px;width:min(700px,95vw);max-height:90vh;padding:24px}dialog::backdrop{background:#0009}label{display:grid;gap:5px;margin:10px 0;color:var(--muted)}input,textarea,select{width:100%}textarea{min-height:85px}input[type=checkbox]{width:auto}a{color:var(--accent)}img,video{width:100%;max-height:320px;object-fit:contain;border-radius:12px;background:var(--bg)}.cover{height:150px;background:linear-gradient(135deg,#5d417e,#29213d);border-radius:12px;display:grid;place-items:center;font-size:40px;margin-bottom:12px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.day{min-height:75px;border:1px solid var(--line);padding:6px;border-radius:8px;overflow-wrap:anywhere;font-size:12px}.day button{font-size:11px;padding:4px;width:100%}.check{display:flex;align-items:center;gap:8px}.danger{color:#f18e9f} @media(max-width:700px){aside{position:static;width:auto;height:auto;padding:14px}nav{display:flex;overflow:auto;margin:12px 0}nav button{white-space:nowrap}main{margin:0;padding:15px}.hero{padding:20px}.day{min-height:55px}.calendar{gap:2px}}
</style><body><aside><div class="brand">✳ Dori Studio</div><small>CREATIVE WORKSPACE / 02</small><nav id="nav"></nav><div class="row"><button id="theme">◐ Тема</button><button id="backup">Експорт</button><button id="restore">Імпорт</button><input type="file" id="file" accept=".json" hidden></div><p><small>Дані залишаються у цьому браузері.</small></p></aside><main id="main"></main><dialog id="modal"><form id="form"><div class="row between"><h2 id="heading"></h2><button type="button" id="close">✕</button></div><div id="fields"></div><div class="row"><button class="primary">Зберегти</button><button type="button" id="del" class="danger">Видалити</button></div></form></dialog><script>
const $=id=>document.getElementById(id), key='dori-studio-v2', pages=['Головна','Тренди','Проєкти','Галерея','Контент-план','Промпти','Фінанси'], steps=['Референси','Промпти','Генерація фото','Анімація','Монтаж','Опис','Публікація','Висновки'];let db={projects:[],trends:[],prompts:[],costs:[]},page=0,month=new Date().toISOString().slice(0,7),edit;try{let old=localStorage.getItem(key);if(old)db=JSON.parse(old);else{let v=JSON.parse(localStorage.getItem('dori-studio-entries-v1')||'[]');db.projects=v.map(x=>({...x,steps:[],date:x.nextDate||'',created:new Date().toISOString().slice(0,10)}))}}catch(e){alert('Не вдалося прочитати локальні дані.')}const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const url=x=>{try{let u=new URL(x);return ['https:','http:'].includes(u.protocol)?esc(u.href):''}catch{return ''}};const today=()=>new Date().toISOString().slice(0,10);function save(){try{localStorage.setItem(key,JSON.stringify(db));return true}catch{alert('Не вдалося зберегти. Перевір сховище браузера.');return false}}function money(n){return Number(n||0).toLocaleString('uk-UA',{maximumFractionDigits:2})+' ₴'}const sum=(a,k)=>a.reduce((s,x)=>s+Number(x[k]||0),0);const done=x=>['Готово','Опубліковано'].includes(x.status);const fields={projects:[['title','Назва'],['category','Напрям',['Предметна реклама','Beauty','Fashion','Lifestyle','Відео','Інше']],['format','Формат',['Фото','Відео']],['status','Статус',['Ідея','Планую','У роботі','Готово','Опубліковано']],['brand','Бренд'],['concept','Концепція','area'],['reference','Референс (URL)'],['tools','Інструменти'],['prompt','Промпт','area'],['date','Дата запланованої публікації','date'],['published','Фактична дата публікації','date'],['media','URL зображення або відео'],['publication','Посилання на публікацію'],['caption','Опис Instagram','area'],['notes','Висновки','area']],trends:[['title','Назва тренду'],['reference','Посилання'],['concept','Чому популярний','area'],['adaptation','Моя адаптація','area'],['prompt','Промпт','area'],['editing','Монтаж','area'],['status','Перспективність',['Новий','Популярний','Хочу спробувати','Випробувано']]],prompts:[['title','Назва'],['model','Модель'],['category','Напрям'],['prompt','Промпт','area'],['notes','Результат / висновки','area']],costs:[['title','Операція / модель'],['project','Проєкт','projects'],['date','Дата','date'],['credits','Кредити','number'],['amount','Витрати, грн','number'],['minutes','Час, хв','number'],['income','Дохід, грн','number'],['notes','Примітки','area']]};
function open(type,id,seed={}){let x=db[type].find(v=>v.id===id)||seed;edit={type,id};$('heading').textContent=id?'Редагувати':'Новий запис';$('del').hidden=!id;$('fields').innerHTML=fields[type].map(([k,l,t])=>{let v=x[k]??(k==='date'&&type==='costs'?today():'');let options=t==='projects'?[['','Без проєкту'],...db.projects.map(p=>[p.id,p.title])]:Array.isArray(t)?t.map(a=>[a,a]):null;return `<label>${l}${options?`<select name="${k}">${options.map(([a,b])=>`<option value="${esc(a)}" ${a===v?'selected':''}>${esc(b)}</option>`).join('')}</select>`:t==='area'?`<textarea name="${k}">${esc(v)}</textarea>`:`<input name="${k}" type="${t||'text'}" value="${esc(v)}" ${k==='title'?'required':''} ${t==='number'?'min="0" step="any"':''}>`}</label>`}).join('')+(type==='projects'?'<h3>Етапи створення</h3>'+steps.map((s,i)=>`<label class="check"><input type="checkbox" name="step" value="${i}" ${(x.steps||[]).includes(String(i))?'checked':''}>${s}</label>`).join(''):'');$('modal').showModal()}
$('form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),{type,id}=edit,prev=db[type].find(x=>x.id===id),x={...prev,...Object.fromEntries(f),id:id||crypto.randomUUID(),created:prev?.created||today()};if(type==='projects')x.steps=f.getAll('step');let before=db[type];db[type]=[x,...before.filter(v=>v.id!==x.id)];if(save()){$('modal').close();render()}else db[type]=before};$('close').onclick=()=>$('modal').close();$('del').onclick=()=>{if(confirm('Видалити запис?')){let before=db[edit.type];db[edit.type]=before.filter(x=>x.id!==edit.id);if(save()){$('modal').close();render()}else db[edit.type]=before}};
function btn(type,x){return `<button data-edit="${type}" data-id="${esc(x.id)}">Відкрити</button>`}function link(v,l){return url(v)?`<a href="${url(v)}" target="_blank" rel="noopener noreferrer">${l}</a>`:''}function project(x){let c=db.costs.filter(v=>v.project===x.id);return `<article class="card"><span class="tag">${esc(x.status)}</span><h3>${esc(x.title)}</h3><small>${esc(x.category)} · ${esc(x.format)}</small><p>${esc(x.concept)}</p><progress max="8" value="${(x.steps||[]).length}"></progress><small>${(x.steps||[]).length}/8 етапів · ${money(sum(c,'amount'))} · ${sum(c,'minutes')} хв</small><p>${link(x.reference,'Референс')} ${link(x.publication,'Публікація')}</p><div class="row">${btn('projects',x)}<button data-cost="${esc(x.id)}">+ Витрати</button></div></article>`}function metric(l,v){return `<div class="card"><small>${l}</small><div class="metric">${v}</div></div>`}function grid(a){return `<div class="grid">${a.join('')||'<p class="muted">Поки немає записів.</p>'}</div>`}function head(t,type){return `<div class="row between"><h1>${t}</h1>${type?`<button class="primary" data-new="${type}">＋ Додати</button>`:''}</div>`}
function render(){ $('nav').innerHTML=pages.map((p,i)=>`<button data-page="${i}" class="${page===i?'active':''}">${['⌂','↗','▣','▧','▦','✧','₴'][i]} ${p}</button>`).join('');let p=db.projects,c=db.costs,m=c.filter(x=>x.date?.startsWith(month)),monthControl=`<label>Місяць<input id="month" type="month" value="${esc(month)}"></label>`,html='';if(page===0){html=`<div class="hero"><small>YOUR CREATIVE SPACE</small><h1>Ідеї стають реальністю.</h1><p>Від першого референсу до готової кампанії.</p><button class="primary" data-new="projects">＋ Новий проєкт</button></div>${grid([metric('Активні проєкти',p.filter(x=>!done(x)).length),metric('Готові роботи',p.filter(done).length),metric('Тренди',db.trends.length)])}<h2>Місячний підсумок</h2>${monthControl}${grid([metric('Створено проєктів',p.filter(x=>x.created?.startsWith(month)).length),metric('Опубліковано',p.filter(x=>x.published?.startsWith(month)).length),metric('Витрати',money(sum(m,'amount'))),metric('Час',sum(m,'minutes')+' хв')])}<h2>У роботі</h2>${grid(p.filter(x=>!done(x)).map(project))}<h2>Найближчі публікації</h2>${grid(p.filter(x=>x.date>=today()&&x.status!=='Опубліковано').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5).map(x=>`<div class="card">${esc(x.date)} · ${esc(x.title)} ${btn('projects',x)}</div>`))}`}
if(page===1)html=head('Тренди','trends')+grid(db.trends.map(x=>`<article class="card"><span class="tag">${esc(x.status)}</span><h3>${esc(x.title)}</h3><p>${esc(x.concept)}</p><p>${esc(x.adaptation)}</p>${link(x.reference,'Приклад')}<div class="row">${btn('trends',x)}<button data-trend="${esc(x.id)}">Створити проєкт</button></div></article>`));if(page===2)html=head('Мої проєкти','projects')+'<input id="search" placeholder="Пошук за назвою, напрямом або статусом"><div id="results">'+grid(p.map(project))+'</div>';if(page===3)html=head('Галерея')+grid(p.filter(done).map(x=>`<article class="card">${url(x.media)?(x.format==='Відео'?`<video controls preload="none" src="${url(x.media)}"></video>`:`<img loading="lazy" src="${url(x.media)}" alt="${esc(x.title)}">`):'<div class="cover">✳</div>'}<h3>${esc(x.title)}</h3>${link(x.publication,'Публікація')} ${btn('projects',x)}</article>`));if(page===4){let [y,mo]=month.split('-').map(Number),offset=(new Date(y,mo-1,1).getDay()+6)%7,n=new Date(y,mo,0).getDate();html=head('Контент-план','projects')+monthControl+'<div class="calendar">'+['Пн','Вт','Ср','Чт','Пт','Сб','Нд'].map(x=>`<small>${x}</small>`).join('')+'<div></div>'.repeat(offset)+Array.from({length:n},(_,i)=>{let d=month+'-'+String(i+1).padStart(2,'0');return `<div class="day">${i+1}${p.filter(x=>x.date===d).map(x=>`<button data-edit="projects" data-id="${esc(x.id)}">${esc(x.title)}</button>`).join('')}</div>`}).join('')+'</div>'}if(page===5)html=head('Бібліотека промптів','prompts')+grid(db.prompts.map(x=>`<article class="card"><h3>${esc(x.title)}</h3><span class="tag">${esc(x.model)}</span><p>${esc(x.prompt)}</p><div class="row">${btn('prompts',x)}<button data-copy="${esc(x.id)}">Копіювати</button></div></article>`));if(page===6)html=head('Фінанси','costs')+monthControl+grid([metric('Витрати',money(sum(m,'amount'))),metric('Дохід',money(sum(m,'income'))),metric('Різниця',money(sum(m,'income')-sum(m,'amount'))),metric('Час',sum(m,'minutes')+' хв')])+ '<h2>Операції за місяць</h2>'+grid(m.map(x=>`<article class="card"><small>${esc(x.date)}</small><h3>${esc(x.title)}</h3><p>${esc(p.find(v=>v.id===x.project)?.title||'Без проєкту')}</p><p>${esc(x.credits||0)} кредитів · ${esc(x.minutes||0)} хв</p><p>Витрати ${money(x.amount)} · Дохід ${money(x.income)}</p>${btn('costs',x)}</article>`));$('main').innerHTML=html; if($('month'))$('month').onchange=e=>{if(e.target.value){month=e.target.value;render()}};if($('search'))$('search').oninput=e=>{$('results').innerHTML=grid(p.filter(x=>[x.title,x.category,x.status,x.concept].join(' ').toLowerCase().includes(e.target.value.toLowerCase())).map(project))}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.page!==undefined){page=+d.page;render()}if(d.new)open(d.new);if(d.edit)open(d.edit,d.id);if(d.cost)open('costs',null,{project:d.cost});if(d.trend){let x=db.trends.find(v=>v.id===d.trend);open('projects',null,{title:x.title,concept:x.adaptation||x.concept,reference:x.reference,prompt:x.prompt})}if(d.copy)navigator.clipboard.writeText(db.prompts.find(x=>x.id===d.copy).prompt).then(()=>alert('Скопійовано')).catch(()=>alert('Не вдалося скопіювати'))});$('theme').onclick=()=>{document.body.classList.toggle('light');try{localStorage.setItem(key+'-theme',document.body.classList.contains('light')?'light':'dark')}catch{}};try{document.body.classList.toggle('light',localStorage.getItem(key+'-theme')==='light')}catch{}$('backup').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='dori-studio-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('restore').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(Array.isArray(x))x={projects:x.map(v=>({...v,steps:[],date:v.nextDate||'',created:today()})),trends:[],prompts:[],costs:[]};if(!Object.keys(db).every(k=>Array.isArray(x[k])&&x[k].every(v=>v&&typeof v.id==='string'&&typeof v.title==='string')))throw Error();if(!confirm('Замінити поточні записи резервною копією?'))return;let before=db;db=x;if(save())render();else db=before}catch{alert('Некоректна резервна копія')}finally{e.target.value=''}};render();
</script></body></html>
